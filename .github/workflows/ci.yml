name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api + web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evalgate
          POSTGRES_PASSWORD: evalgate
          POSTGRES_DB: evalgate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evalgate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://evalgate:evalgate@localhost:5432/evalgate
    steps:
      - uses: actions/checkout@v5

      # No "version" key: reads "packageManager" from the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: apps/api
        run: pnpm exec prisma generate

      - name: Prisma migrate deploy
        working-directory: apps/api
        run: pnpm exec prisma migrate deploy

      - name: Typecheck API
        working-directory: apps/api
        run: pnpm exec tsc --noEmit

      - name: Build web
        working-directory: apps/web
        run: pnpm run build

  runner:
    name: runner
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/runner
    env:
      ANTHROPIC_API_KEY: ci-dummy-key-not-used
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --dev

      - name: Test
        run: uv run pytest -q