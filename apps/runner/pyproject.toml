[project]
name = "runner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "anthropic>=1.7.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "tenacity>=9.1.4",
    "uvicorn>=0.53.0",
]
[project.scripts]
evalgate-ingest = "evalgate.ingest:main"
evalgate-convert-swebench = "evalgate.datasets.swebench:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]