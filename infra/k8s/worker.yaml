apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalgate-worker
spec:
  replicas: 3
  selector:
    matchLabels: { app: evalgate-worker }
  template:
    metadata:
      labels: { app: evalgate-worker }
    spec:
      containers:
        - name: worker
          image: evalgate/runner:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: evalgate, key: database-url }
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: evalgate, key: anthropic-key }
            - name: CONCURRENCY
              value: "8"
            - name: JUDGE_MODEL
              valueFrom:
                configMapKeyRef:
                  name: evalgate
                  key: judge-model
                  optional: true
            - name: MODEL_PRICING
              valueFrom:
                configMapKeyRef:
                  name: evalgate
                  key: model-pricing
                  optional: true
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
      terminationGracePeriodSeconds: 60